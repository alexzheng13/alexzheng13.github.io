<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1030" viewBox="0 0 1080 1030" role="img" aria-labelledby="title desc">
<title id="title">The autoresearch experiment ratchet</title>
<desc id="desc">Read rules and the baseline, propose a hypothesis, edit and snapshot the candidate, train for a fixed budget, evaluate and log, then keep or discard. Both branches feed the next experiment. The evaluator and data stay fixed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#687d8c"/></marker></defs>
<rect width="1080" height="1030" rx="20" fill="#f8fafc"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#243b4b">
<text x="54" y="57" font-size="29" font-weight="700">The experiment ratchet</text><text x="54" y="88" font-size="17" fill="#647786">Explore candidates; retain an evidence-backed working baseline</text>
<g stroke="#c8d4dd" stroke-width="1.5"><rect x="200" y="122" width="680" height="100" rx="12" fill="#e8f0fa"/><rect x="200" y="260" width="680" height="100" rx="12" fill="#e3f2e9"/><rect x="200" y="398" width="680" height="100" rx="12" fill="#e3f2e9"/><rect x="200" y="536" width="680" height="100" rx="12" fill="#f0eafa"/><rect x="80" y="694" width="420" height="100" rx="12" fill="#e3f2e9"/><rect x="580" y="694" width="420" height="100" rx="12" fill="#f9e9e5"/><rect x="200" y="858" width="680" height="100" rx="12" fill="#fff1d8"/></g>
<g font-size="23" font-weight="700"><text x="228" y="159">1–2. Read rules, code and experiment history</text><text x="228" y="297">3–5. Hypothesize, edit and snapshot</text><text x="228" y="435">6. Run training</text><text x="228" y="573">7. Evaluate and log</text><text x="108" y="731">8. Keep</text><text x="608" y="731">8. Discard / recover</text><text x="228" y="895">9. Start the next experiment</text></g>
<g font-size="18" fill="#526a79"><text x="228" y="191">program.md + current baseline + results.tsv</text><text x="228" y="329">Change train.py; identify the exact candidate revision</text><text x="228" y="467">300-second training budget, plus startup / evaluation</text><text x="228" y="605">val_bpb + memory + status + description</text><text x="108" y="763">Accept under the selection rules</text><text x="608" y="763">Restore the usable baseline</text><text x="228" y="927">Use history; respect the overall campaign budget</text></g>
<g fill="none" stroke="#687d8c" stroke-width="2" marker-end="url(#arrow)"><path d="M540 222V260"/><path d="M540 360V398"/><path d="M540 498V536"/><path d="M400 636V666H290V694"/><path d="M680 636V666H790V694"/><path d="M290 794V825H430V858"/><path d="M790 794V825H650V858"/><path d="M880 908H1034V172H880"/></g>
<text x="54" y="1001" font-size="17" fill="#647786">Fixed evaluation and data in prepare.py; failed experiments remain in the log.</text>
</g></svg>
